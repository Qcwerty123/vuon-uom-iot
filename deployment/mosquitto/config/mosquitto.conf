# mosquitto.conf — broker MQTT của hệ thống vườn ươm
# Đặc tả: docs/dac-ta-he-thong.md §8.8, §17.2

per_listener_settings false

listener 1883
allow_anonymous false

# Dynamic Security: tài khoản và ACL của từng thiết bị được backend tạo/khóa lúc chạy.
# File dynamic-security.json được tạo bằng deployment/mosquitto/init-dynsec.sh
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# ---- TLS (bật khi có chứng chỉ, đặc tả §22 C5) ----
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
