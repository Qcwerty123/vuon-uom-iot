# mosquitto.windows.conf — Mẫu cấu hình Mosquitto cho Windows
# Sinh ra runtime/mosquitto/mosquitto.conf bởi scripts/windows/init-broker.ps1
# Đặc tả: docs/dac-ta-he-thong.md §8.8, §17.5

per_listener_settings false

listener 1883 0.0.0.0
allow_anonymous false

# Dynamic Security plugin
plugin {{REPO_ROOT}}/tools/mosquitto/mosquitto_dynamic_security.dll
plugin_opt_config_file {{REPO_ROOT}}/runtime/mosquitto/dynamic-security.json

persistence true
persistence_location {{REPO_ROOT}}/runtime/mosquitto/

log_dest file {{REPO_ROOT}}/logs/services/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

